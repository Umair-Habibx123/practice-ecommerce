<!DOCTYPE html>
<html lang="en">
<head>
    <!-- , and checkout sections -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock E-commerce Website</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo"><a href="home.html">E-commerce Shop</a></h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="cart">

        </section>
        <section class="cart">
            <h2>Shopping Cart</h2>
            <ul id="cart-items">
                <!-- Cart items will be displayed here -->
            </ul>
            <p>Total: $<span id="cart-total">0.00</span></p>
            <button id="check" onclick="checkout()">Checkout</button>
            <button id="Clear" onclick="clearLocalStorage()">Clear Cart</button>
        </section>
    </main>

    
     <div id="clonnerContainer" class="clonnerContainer">
        <!-- Message box -->
        <div id="clonner" class="clonner">
            <h1>Checkout</h1>
            <form id="checkoutForm">
                <label for="cardNumber">Card Number:</label>
                <input type="number" id="cardNumber" name="cardNumber" placeholder="Enter your card number" required><br><br>
                
                <label for="cardName">Name on Card:</label>
                <input type="text" id="cardName" name="cardName" placeholder="Enter the name on your card" required><br><br>
                
                <label for="expiryDate">Expiry Date:</label>
                <input type="date" id="expiryDate" name="expiryDate" placeholder="MM/YYYY" required><br><br>
                
                <label for="cvv">CVV:</label>
                <input type="number" id="cvv" name="cvv" placeholder="Enter CVV" required><br><br>
                
                <input type="submit" value="Submit">
            </form>
            <button onclick="hideMessageBox()">Close</button>

        </div>
    </div>
    
    <script src="products.js"></script>
    <script src="cart.js"></script>

</body>
</html>
