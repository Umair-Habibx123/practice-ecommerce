<!DOCTYPE html>
<html lang="en">
<head>
    <!-- , and checkout sections -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock E-commerce Website</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo"><a href="home.html">E-commerce Shop</a></h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <div class="container2">
        <h3>Contact Form</h3>
        <form action="#" name="contact_form">
            <label for="first_name">First Name</label>
            <input name="first_name" type="text" required placeholder="John"/>
            <br>
            <label for="last_name">Last Name</label>
            <input name="last_name" type="text" required placeholder="Doe"/>
            <br>
            <label for="email">Email</label>
            <input name="email" type="email" required placeholder="you@domain.com"/>
            <br>
            <label for="message">Message</label><br>
            <textarea name="message" cols="30" rows="10" placeholder="Enter your message here ..." required> </textarea>
            <div class="center">
                <input type="submit" onclick='alert("Hello, this is an alert box!");'>
            </div>
        </form>	
    </div>

    <footer>
        <div class="footer-container">
            <div class="footer-section">
                <h3>Explore</h3>
                <ul>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Announcements</a></li>
                    <li><a href="#">Community</a></li>
                    <li><a href="#">Security Center</a></li>
                    <!-- Add more links as needed -->
                </ul>
            </div>
            <div class="footer-section">
                <h3>Help & Contact</h3>
                <ul>
                    <li><a href="#">Resolution Center</a></li>
                    <li><a href="#">Seller Center</a></li>
                    <li><a href="#">Contact Us</a></li>
                    <!-- Add more links as needed -->
                </ul>
            </div>
            <div class="footer-section">
                <h3>Legal</h3>
                <ul>
                    <li><a href="#">Privacy Policy</a></li>
                    <li><a href="#">User Agreement</a></li>
                    <li><a href="#">Accessibility</a></li>
                    <!-- Add more links as needed -->
                </ul>
            </div>
            <div class="footer-section">
                <h3>Follow</h3>
                <ul class="social-media">
                    <li><a href="#"><img src="facebook.png" alt="Facebook" height="30px" width="30px"></a></li>
                    <li><a href="#"><img src="twitter.png" alt="Twitter" height="30px" width="30px"></a></li>
                    <li><a href="#"><img src="instagram.png" alt="Instagram" height="30px" width="30px"></a></li>
                    <!-- Add more social media icons as needed -->
                </ul>
            </div>
        </div>
    </footer>
    <script src="cart.js"></script>

</body>
</html>
