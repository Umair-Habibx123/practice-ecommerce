<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopwave — Cart</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div data-header></div>

  <main class="section container">
    <h1 class="section__title">Your Cart</h1>
    <div class="cart-layout">
      <div class="cart-items" data-cart-items></div>

      <aside class="cart-summary" data-cart-summary hidden>
        <h3>Order Summary</h3>
        <div class="cart-summary__row"><span>Subtotal</span><span data-subtotal>$0.00</span></div>
        <div class="cart-summary__row"><span>Shipping</span><span>Free</span></div>
        <div class="cart-summary__total"><span>Total</span><span data-total>$0.00</span></div>
        <button class="btn btn--block" data-checkout>Checkout</button>
        <button class="btn btn--ghost btn--block" data-clear style="margin-top:.75rem">Clear Cart</button>
      </aside>
    </div>
  </main>

  <!-- Checkout modal -->
  <div class="modal" data-checkout-modal hidden>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-label="Checkout">
      <h2>Checkout</h2>
      <form class="form">
        <div>
          <label for="cardName">Name on Card</label>
          <input id="cardName" name="cardName" type="text" autocomplete="cc-name" required>
        </div>
        <div>
          <label for="cardNumber">Card Number</label>
          <input id="cardNumber" name="cardNumber" inputmode="numeric" pattern="[0-9 ]{12,19}" placeholder="1234 5678 9012 3456" required>
        </div>
        <div>
          <label for="expiry">Expiry</label>
          <input id="expiry" name="expiry" type="month" required>
        </div>
        <div>
          <label for="cvv">CVV</label>
          <input id="cvv" name="cvv" inputmode="numeric" pattern="[0-9]{3,4}" placeholder="123" required>
        </div>
        <button class="btn btn--block" type="submit">Place Order</button>
      </form>
      <button class="btn btn--ghost modal__close" data-close>Cancel</button>
    </div>
  </div>

  <div data-footer></div>
  <script type="module" src="./js/pages/cart.js"></script>
</body>
</html>
